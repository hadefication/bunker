[package]
name = "bunker"
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.92"
description = "Host personal web apps on a Mac in confined Lima VMs behind Cloudflare tunnels"
license = "MIT"
repository = "https://github.com/hadefication/bunker"
homepage = "https://github.com/hadefication/bunker"
keywords = ["laravel", "lima", "deployment", "macos", "cloudflare"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
bytes = "1.12.1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
toml = "1.2.1"
toml_edit = "0.25.19"

[dev-dependencies]
assert_cmd = "2"
serde_json = "1"
tempfile = "3.27.0"
