[package]
name = "bunker"
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.92"
description = "Host personal web apps on a Mac in confined Lima VMs behind Cloudflare tunnels"
license = "MIT"
repository = "https://github.com/hadefication/bunker"
homepage = "https://github.com/hadefication/bunker"
keywords = ["laravel", "lima", "deployment", "macos", "cloudflare"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2"
