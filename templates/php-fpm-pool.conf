; Written by bunker up; changes here are overwritten.
[app]
user = app
group = app
listen = /run/php/app.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
clear_env = yes
; Outbound calls go through bunker's proxy: the guest has no resolver of its own. No HTTP_PROXY
; (httpoxy): under FastCGI that name belongs to a request's Proxy: header.
env[HTTPS_PROXY] = http://127.0.0.1:3128
env[https_proxy] = http://127.0.0.1:3128
env[http_proxy] = http://127.0.0.1:3128
env[NO_PROXY] = localhost,127.0.0.1
env[no_proxy] = localhost,127.0.0.1
