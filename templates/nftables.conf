#!/usr/sbin/nft -f
# Written by bunker up; changes here are overwritten. Defense in depth only: the host-side
# Seatbelt confinement and the egress proxy are the boundary.
# Replace only bunker's table (create-then-delete makes it idempotent); Lima keeps its own.
table inet bunker
delete table inet bunker

table inet bunker {
    chain output {
        type filter hook output priority 0; policy accept;
        ct state established,related accept
        oif "lo" accept
        # Replies from the guest's sshd: Lima drives the guest over SSH, and a session open when
        # these rules load is first seen mid-stream as "new", not "established".
        tcp sport 22 accept
        # DHCP renewals go to the virtual network's gateway.
        udp dport 67 accept
        ip daddr { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/4, 240.0.0.0/4 } drop
        ip6 daddr { fc00::/7, fe80::/10, ff00::/8 } drop
    }
}
